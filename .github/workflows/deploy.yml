name: Deploy to AWS App Runner

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  APP_RUNNER_ARN: ${{ secrets.APP_RUNNER_ARN }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: set-image-tag
        run: |
          TAG=$(echo ${{ github.sha }} | cut -c1-7)
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Image tag set to: $TAG"

      - name: Build, tag, and push Docker image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ steps.set-image-tag.outputs.tag }}
        run: |
          echo "Building Docker image..."
          docker build --platform linux/amd64 -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "Pushing Docker image to ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "Image pushed successfully: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Get App Runner service details
        id: get-apprunner-details
        run: |
          # 检查服务是否存在
          SERVICE_NAME="bee-edu-rag-service"
          echo "service_name=$SERVICE_NAME" >> $GITHUB_OUTPUT
          
          # 动态获取角色 ARNs（根据 Terraform 创建的角色名称）
          # 角色名称是固定的：bee-edu-apprunner-role 和 bee-edu-apprunner-instance-role
          ACCESS_ROLE_NAME="bee-edu-apprunner-role"
          INSTANCE_ROLE_NAME="bee-edu-apprunner-instance-role"
          
          # 通过 AWS CLI 获取角色 ARN（IAM 是全局服务，不需要 region）
          ACCESS_ROLE_ARN=$(aws iam get-role \
            --role-name "$ACCESS_ROLE_NAME" \
            --query 'Role.Arn' \
            --output text 2>/dev/null || echo "")
          
          INSTANCE_ROLE_ARN=$(aws iam get-role \
            --role-name "$INSTANCE_ROLE_NAME" \
            --query 'Role.Arn' \
            --output text 2>/dev/null || echo "")
          
          # 如果服务已存在，也可以从服务配置中获取（作为备选）
          if [ -z "$ACCESS_ROLE_ARN" ] && [ -n "${{ env.APP_RUNNER_ARN }}" ] && [[ "${{ env.APP_RUNNER_ARN }}" =~ ^arn:aws:apprunner: ]]; then
            echo "Service ARN provided, attempting to get service details..."
            SERVICE_INFO=$(aws apprunner describe-service \
              --service-arn "${{ env.APP_RUNNER_ARN }}" \
              --region ${{ env.AWS_REGION }} \
              --output json 2>/dev/null || echo "{}")
            
            ACCESS_ROLE_ARN=$(echo $SERVICE_INFO | jq -r '.Service.SourceConfiguration.AuthenticationConfiguration.AccessRoleArn // empty' 2>/dev/null || echo "")
            INSTANCE_ROLE_ARN=$(echo $SERVICE_INFO | jq -r '.Service.InstanceConfiguration.InstanceRoleArn // empty' 2>/dev/null || echo "")
          fi
          
          # 验证角色 ARNs
          if [ -z "$ACCESS_ROLE_ARN" ] || [ "$ACCESS_ROLE_ARN" == "None" ] || [ "$ACCESS_ROLE_ARN" == "" ]; then
            echo "Error: AccessRoleArn is required but not found"
            echo "Please ensure the role 'bee-edu-apprunner-role' exists in AWS"
            exit 1
          fi
          
          if [ -z "$INSTANCE_ROLE_ARN" ] || [ "$INSTANCE_ROLE_ARN" == "None" ] || [ "$INSTANCE_ROLE_ARN" == "" ]; then
            echo "Error: InstanceRoleArn is required but not found"
            echo "Please ensure the role 'bee-edu-apprunner-instance-role' exists in AWS"
            exit 1
          fi
          
          echo "access_role_arn=$ACCESS_ROLE_ARN" >> $GITHUB_OUTPUT
          echo "instance_role_arn=$INSTANCE_ROLE_ARN" >> $GITHUB_OUTPUT
          echo "Access Role ARN: $ACCESS_ROLE_ARN"
          echo "Instance Role ARN: $INSTANCE_ROLE_ARN"

      - name: Get or Create Secrets Manager Secret
        id: get-secrets-arn
        run: |
          SECRET_NAME="bee-edu-openai-key-secret"
          
          # 尝试获取现有的 secret
          SECRET_ARN=$(aws secretsmanager describe-secret \
            --secret-id "$SECRET_NAME" \
            --region ${{ env.AWS_REGION }} \
            --query 'ARN' \
            --output text 2>/dev/null || echo "")
          
          if [ -z "$SECRET_ARN" ] || [ "$SECRET_ARN" == "None" ]; then
            echo "Secret '$SECRET_NAME' not found. Attempting to create it..."
            
            # 检查是否有 GitHub Secret 提供 API Key
            if [ -z "${{ secrets.OPENAI_API_KEY }}" ]; then
              echo "Error: Secret '$SECRET_NAME' not found in AWS Secrets Manager"
              echo "And GitHub Secret 'OPENAI_API_KEY' is not set."
              echo ""
              echo "Please do one of the following:"
              echo "1. Run 'terraform apply' to create the secret, OR"
              echo "2. Add 'OPENAI_API_KEY' as a GitHub Secret to allow automatic creation"
              echo ""
              echo "To add GitHub Secret:"
              echo "  - Go to: https://github.com/${{ github.repository }}/settings/secrets/actions"
              echo "  - Click 'New repository secret'"
              echo "  - Name: OPENAI_API_KEY"
              echo "  - Value: your-openai-api-key"
              echo "secret_arn=" >> $GITHUB_OUTPUT
              exit 1
            fi
            
            # 创建 secret
            echo "Creating secret '$SECRET_NAME' in AWS Secrets Manager..."
            CREATE_RESULT=$(aws secretsmanager create-secret \
              --name "$SECRET_NAME" \
              --secret-string "${{ secrets.OPENAI_API_KEY }}" \
              --region ${{ env.AWS_REGION }} \
              --query 'ARN' \
              --output text 2>&1)
            
            if [ $? -eq 0 ] && [[ "$CREATE_RESULT" =~ ^arn:aws:secretsmanager: ]]; then
              SECRET_ARN="$CREATE_RESULT"
              echo "Successfully created secret: $SECRET_ARN"
            else
              echo "Error creating secret: $CREATE_RESULT"
              exit 1
            fi
          else
            echo "Found existing secret: $SECRET_ARN"
          fi
          
          # 验证 ARN 格式
          if [[ ! "$SECRET_ARN" =~ ^arn:aws:secretsmanager: ]]; then
            echo "Error: Invalid secret ARN format: $SECRET_ARN"
            exit 1
          fi
          
          echo "secret_arn=$SECRET_ARN" >> $GITHUB_OUTPUT
          echo "Using secret ARN: $SECRET_ARN"
          
          # 验证实例角色是否有权限读取该 secret
          INSTANCE_ROLE_ARN="${{ steps.get-apprunner-details.outputs.instance_role_arn }}"
          echo "Instance Role ARN: $INSTANCE_ROLE_ARN"
          
          # 验证 secret 可以被访问（使用当前角色的权限测试）
          echo "Verifying secret accessibility..."
          SECRET_TEST=$(aws secretsmanager get-secret-value \
            --secret-id "$SECRET_ARN" \
            --region ${{ env.AWS_REGION }} \
            --query 'ARN' \
            --output text 2>&1)
          
          if [[ "$SECRET_TEST" =~ ^arn:aws:secretsmanager: ]]; then
            echo "✓ Secret is accessible"
          else
            echo "⚠️  Warning: Could not verify secret accessibility: $SECRET_TEST"
            echo "This might indicate a permissions issue, but continuing anyway..."
          fi

      - name: Check if App Runner service exists
        id: check-service
        run: |
          SERVICE_NAME="${{ steps.get-apprunner-details.outputs.service_name }}"
          EXISTING_SERVICE=$(aws apprunner list-services \
            --region ${{ env.AWS_REGION }} \
            --query "ServiceSummaryList[?ServiceName=='$SERVICE_NAME'].ServiceArn" \
            --output text 2>/dev/null || echo "")
          
          if [ -n "$EXISTING_SERVICE" ] && [ "$EXISTING_SERVICE" != "None" ]; then
            # 检查服务状态
            SERVICE_STATUS=$(aws apprunner describe-service \
              --service-arn "$EXISTING_SERVICE" \
              --region ${{ env.AWS_REGION }} \
              --query 'Service.Status' \
              --output text 2>/dev/null || echo "")
            
            echo "Found existing service: $EXISTING_SERVICE"
            echo "Service status: $SERVICE_STATUS"
            
            if [ "$SERVICE_STATUS" = "CREATE_FAILED" ] || [ "$SERVICE_STATUS" = "DELETE_FAILED" ]; then
              echo "Service is in failed state, will delete and recreate"
              echo "service_exists=false" >> $GITHUB_OUTPUT
              echo "service_arn=$EXISTING_SERVICE" >> $GITHUB_OUTPUT
              echo "service_status=$SERVICE_STATUS" >> $GITHUB_OUTPUT
            else
              echo "Service exists and can be updated"
              echo "service_exists=true" >> $GITHUB_OUTPUT
              echo "service_arn=$EXISTING_SERVICE" >> $GITHUB_OUTPUT
              echo "service_status=$SERVICE_STATUS" >> $GITHUB_OUTPUT
            fi
          else
            echo "Service does not exist, will create new one"
            echo "service_exists=false" >> $GITHUB_OUTPUT
            echo "service_arn=" >> $GITHUB_OUTPUT
            echo "service_status=" >> $GITHUB_OUTPUT
          fi

      - name: Delete failed service if exists
        if: steps.check-service.outputs.service_exists == 'false' && steps.check-service.outputs.service_arn != ''
        run: |
          echo "Deleting failed service: ${{ steps.check-service.outputs.service_arn }}"
          aws apprunner delete-service \
            --service-arn "${{ steps.check-service.outputs.service_arn }}" \
            --region ${{ env.AWS_REGION }} || true
          echo "Waiting for service deletion..."
          sleep 10

      - name: Deploy to AWS App Runner (with Secrets Manager)
        if: steps.get-secrets-arn.outputs.secret_arn != ''
        run: |
          SERVICE_NAME="${{ steps.get-apprunner-details.outputs.service_name }}"
          IMAGE_URI="${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.set-image-tag.outputs.tag }}"
          SECRET_ARN="${{ steps.get-secrets-arn.outputs.secret_arn }}"
          
          echo "=== Deployment Configuration ==="
          echo "Service Name: $SERVICE_NAME"
          echo "Image URI: $IMAGE_URI"
          echo "Secret ARN: $SECRET_ARN"
          echo "Access Role ARN: ${{ steps.get-apprunner-details.outputs.access_role_arn }}"
          echo "Instance Role ARN: ${{ steps.get-apprunner-details.outputs.instance_role_arn }}"
          
          # 创建 JSON 配置文件
          cat > /tmp/service-config.json <<EOF
          {
            "ImageRepository": {
              "ImageIdentifier": "$IMAGE_URI",
              "ImageRepositoryType": "ECR",
              "ImageConfiguration": {
                "Port": "8080",
                "RuntimeEnvironmentSecrets": {
                  "OPENAI_API_KEY": "$SECRET_ARN"
                }
              }
            },
            "AuthenticationConfiguration": {
              "AccessRoleArn": "${{ steps.get-apprunner-details.outputs.access_role_arn }}"
            },
            "AutoDeploymentsEnabled": false
          }
          EOF
          
          echo "=== Service Configuration JSON ==="
          cat /tmp/service-config.json
          echo ""
          
          # 创建健康检查配置
          cat > /tmp/health-check-config.json <<EOF
          {
            "Protocol": "HTTP",
            "Path": "/health",
            "Interval": 10,
            "Timeout": 5,
            "HealthyThreshold": 1,
            "UnhealthyThreshold": 5
          }
          EOF
          
          cat > /tmp/instance-config.json <<EOF
          {
            "Cpu": "1024",
            "Memory": "2048",
            "InstanceRoleArn": "${{ steps.get-apprunner-details.outputs.instance_role_arn }}"
          }
          EOF
          
          # 使用之前检查的结果
          EXISTING_SERVICE="${{ steps.check-service.outputs.service_arn }}"
          SERVICE_EXISTS="${{ steps.check-service.outputs.service_exists }}"
          
          if [ "$SERVICE_EXISTS" = "true" ] && [ -n "$EXISTING_SERVICE" ] && [ "$EXISTING_SERVICE" != "None" ]; then
            echo "Service exists, updating..."
            UPDATE_RESULT=$(aws apprunner update-service \
              --service-arn "$EXISTING_SERVICE" \
              --region ${{ env.AWS_REGION }} \
              --source-configuration file:///tmp/service-config.json \
              --instance-configuration file:///tmp/instance-config.json \
              --health-check-configuration file:///tmp/health-check-config.json \
              --output json 2>&1)
            
            if [ $? -eq 0 ]; then
              echo "Service update initiated successfully"
              echo "$UPDATE_RESULT" | jq '.'
            else
              echo "Error updating service:"
              echo "$UPDATE_RESULT"
              exit 1
            fi
          else
            echo "Creating new service with Secrets Manager..."
            
            # Validate JSON files before sending
            echo "Validating JSON configuration files..."
            jq . /tmp/service-config.json > /dev/null || { echo "Invalid service-config.json"; exit 1; }
            jq . /tmp/instance-config.json > /dev/null || { echo "Invalid instance-config.json"; exit 1; }
            jq . /tmp/health-check-config.json > /dev/null || { echo "Invalid health-check-config.json"; exit 1; }
            echo "JSON files are valid"
            
            # Check if service exists (might have been created between checks)
            FINAL_CHECK=$(aws apprunner list-services \
              --region ${{ env.AWS_REGION }} \
              --query "ServiceSummaryList[?ServiceName=='$SERVICE_NAME'].ServiceArn" \
              --output text 2>/dev/null || echo "")
            
            if [ -n "$FINAL_CHECK" ] && [ "$FINAL_CHECK" != "None" ]; then
              echo "Service was created between checks, updating instead..."
              EXISTING_SERVICE="$FINAL_CHECK"
              UPDATE_RESULT=$(aws apprunner update-service \
                --service-arn "$EXISTING_SERVICE" \
                --region ${{ env.AWS_REGION }} \
                --source-configuration file:///tmp/service-config.json \
                --instance-configuration file:///tmp/instance-config.json \
                --health-check-configuration file:///tmp/health-check-config.json \
                --output json 2>&1)
              
              if [ $? -eq 0 ]; then
                echo "Service update initiated successfully"
                echo "$UPDATE_RESULT" | jq '.' || echo "$UPDATE_RESULT"
              else
                echo "Error updating service:"
                echo "$UPDATE_RESULT"
                exit 1
              fi
            else
              # Attempt to create service and capture both stdout and stderr
              set +e
              CREATE_OUTPUT=$(aws apprunner create-service \
                --service-name "$SERVICE_NAME" \
                --region ${{ env.AWS_REGION }} \
                --source-configuration file:///tmp/service-config.json \
                --instance-configuration file:///tmp/instance-config.json \
                --health-check-configuration file:///tmp/health-check-config.json \
                --output json 2>&1)
              CREATE_EXIT_CODE=$?
              set -e
              
              if [ $CREATE_EXIT_CODE -eq 0 ]; then
                echo "Service creation initiated successfully"
                echo "$CREATE_OUTPUT" | jq '.' || echo "$CREATE_OUTPUT"
              else
                echo "=== Error creating service ==="
                echo "Exit code: $CREATE_EXIT_CODE"
                echo "Error output:"
                echo "$CREATE_OUTPUT"
                
                # Check if error is because service already exists
                if echo "$CREATE_OUTPUT" | grep -qi "already exists"; then
                  echo ""
                  echo "⚠️  Service already exists. Attempting to update instead..."
                  EXISTING_SERVICE=$(aws apprunner list-services \
                    --region ${{ env.AWS_REGION }} \
                    --query "ServiceSummaryList[?ServiceName=='$SERVICE_NAME'].ServiceArn" \
                    --output text 2>/dev/null || echo "")
                  
                  if [ -n "$EXISTING_SERVICE" ] && [ "$EXISTING_SERVICE" != "None" ]; then
                    echo "Found existing service: $EXISTING_SERVICE"
                    UPDATE_RESULT=$(aws apprunner update-service \
                      --service-arn "$EXISTING_SERVICE" \
                      --region ${{ env.AWS_REGION }} \
                      --source-configuration file:///tmp/service-config.json \
                      --instance-configuration file:///tmp/instance-config.json \
                      --health-check-configuration file:///tmp/health-check-config.json \
                      --output json 2>&1)
                    
                    if [ $? -eq 0 ]; then
                      echo "Service update initiated successfully"
                      echo "$UPDATE_RESULT" | jq '.' || echo "$UPDATE_RESULT"
                    else
                      echo "Error updating service:"
                      echo "$UPDATE_RESULT"
                      exit 1
                    fi
                  else
                    echo "Could not find service ARN for update"
                    exit 1
                  fi
                else
                  # Try to extract error message if it's JSON
                  ERROR_MSG=$(echo "$CREATE_OUTPUT" | jq -r '.message // .Message // .' 2>/dev/null || echo "$CREATE_OUTPUT")
                  echo ""
                  echo "Error message: $ERROR_MSG"
                  
                  # Check for common issues
                  if echo "$CREATE_OUTPUT" | grep -qi "permission"; then
                    echo ""
                    echo "⚠️  Permission issue detected. Please check IAM roles and policies."
                  fi
                  if echo "$CREATE_OUTPUT" | grep -qi "invalid"; then
                    echo ""
                    echo "⚠️  Invalid configuration detected. Please check the JSON structure."
                  fi
                  
                  exit 1
                fi
              fi
            fi
          fi

      - name: Wait for service stability
        run: |
          SERVICE_NAME="${{ steps.get-apprunner-details.outputs.service_name }}"
          echo "Waiting for service to become stable..."
          
          for i in {1..60}; do
            SERVICE_INFO=$(aws apprunner list-services \
              --region ${{ env.AWS_REGION }} \
              --query "ServiceSummaryList[?ServiceName=='$SERVICE_NAME']" \
              --output json 2>/dev/null || echo "[]")
            
            SERVICE_STATUS=$(echo "$SERVICE_INFO" | jq -r '.[0].Status // "NOT_FOUND"')
            SERVICE_ARN=$(echo "$SERVICE_INFO" | jq -r '.[0].ServiceArn // ""')
            
            if [ "$SERVICE_STATUS" = "RUNNING" ]; then
              echo "Service is RUNNING!"
              echo "Service ARN: $SERVICE_ARN"
              break
            elif [ "$SERVICE_STATUS" = "CREATE_FAILED" ] || [ "$SERVICE_STATUS" = "UPDATE_FAILED" ]; then
              echo "=== Service creation/update failed! ==="
              if [ -n "$SERVICE_ARN" ]; then
                echo "Service ARN: $SERVICE_ARN"
                echo ""
                echo "Getting service details..."
                SERVICE_DETAILS=$(aws apprunner describe-service \
                  --service-arn "$SERVICE_ARN" \
                  --region ${{ env.AWS_REGION }} \
                  --output json 2>/dev/null || echo "{}")
                
                # Extract error information
                ERROR_MSG=$(echo "$SERVICE_DETAILS" | jq -r '.Service.StatusMessage // .Service.Status // "Unknown error"' 2>/dev/null || echo "Could not parse error")
                echo "Error message: $ERROR_MSG"
                
                echo ""
                echo "Getting operation details..."
                OPERATIONS=$(aws apprunner list-operations \
                  --service-arn "$SERVICE_ARN" \
                  --region ${{ env.AWS_REGION }} \
                  --output json 2>/dev/null || echo "{}")
                
                LATEST_OP=$(echo "$OPERATIONS" | jq -r '.OperationSummaryList[0] // {}' 2>/dev/null || echo "{}")
                if [ "$LATEST_OP" != "{}" ] && [ -n "$LATEST_OP" ]; then
                  OPERATION_ID=$(echo "$LATEST_OP" | jq -r '.Id // ""' 2>/dev/null || echo "")
                  OPERATION_TYPE=$(echo "$LATEST_OP" | jq -r '.Type // ""' 2>/dev/null || echo "")
                  OPERATION_STATUS=$(echo "$LATEST_OP" | jq -r '.Status // ""' 2>/dev/null || echo "")
                  
                  echo "Operation ID: $OPERATION_ID"
                  echo "Operation Type: $OPERATION_TYPE"
                  echo "Operation Status: $OPERATION_STATUS"
                  
                  # Try to get detailed operation info
                  if [ -n "$OPERATION_ID" ]; then
                    echo ""
                    echo "Getting detailed operation information..."
                    OP_DETAILS=$(aws apprunner describe-operation \
                      --operation-id "$OPERATION_ID" \
                      --region ${{ env.AWS_REGION }} \
                      --output json 2>/dev/null || echo "{}")
                    
                    OP_ERROR=$(echo "$OP_DETAILS" | jq -r '.Operation.ErrorMessage // .Operation.ErrorCode // "No error details"' 2>/dev/null || echo "Could not parse")
                    echo "Operation Error: $OP_ERROR"
                  fi
                fi
                
                echo ""
                echo "=== Service Configuration ==="
                echo "$SERVICE_DETAILS" | jq '.Service | {Status, StatusMessage, SourceConfiguration, InstanceConfiguration}' 2>/dev/null || echo "Could not parse service details"
              fi
              exit 1
            fi
            
            echo "Service status: $SERVICE_STATUS (attempt $i/60)"
            sleep 10
          done
          
          if [ "$SERVICE_STATUS" != "RUNNING" ]; then
            echo "=== Service did not reach RUNNING state in time ==="
            echo "Final status: $SERVICE_STATUS"
            
            if [ -n "$SERVICE_ARN" ]; then
              echo ""
              echo "Getting final service status..."
              SERVICE_DETAILS=$(aws apprunner describe-service \
                --service-arn "$SERVICE_ARN" \
                --region ${{ env.AWS_REGION }} \
                --output json 2>/dev/null || echo "{}")
              
              STATUS_MSG=$(echo "$SERVICE_DETAILS" | jq -r '.Service.StatusMessage // "No status message"' 2>/dev/null || echo "Could not parse")
              echo "Status message: $STATUS_MSG"
              
              # Check if it's still in progress
              if [ "$SERVICE_STATUS" = "OPERATION_IN_PROGRESS" ]; then
                echo ""
                echo "⚠️  Service is still in progress. This might take longer than expected."
                echo "You can check the service status in AWS Console:"
                echo "https://console.aws.amazon.com/apprunner/home?region=${{ env.AWS_REGION }}#/services/$SERVICE_ARN"
                echo ""
                echo "The deployment may still succeed. Please check AWS Console for final status."
              fi
            fi
            exit 1
          fi

